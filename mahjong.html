<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サンマ 完成版</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body{
    margin:0;
    background:#0b3d2e;
    color:white;
    font-family:sans-serif;
}

#info{position:absolute;top:10px;left:10px;}

#hand{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
}

.tile{
    width:40px;height:60px;
    background:white;color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border-radius:6px;
}
</style>
</head>

<body>

<div id="info"></div>
<div id="hand"></div>

<script>
const peer = new Peer();

let conn = null;
let isHost = false;
let myIndex = 0;
let connected = false;

/* ===== ゲーム状態 ===== */
let game = {
    turn: 0,
    hands: [[],[],[]],
    river: [[],[],[]],
    wall: []
};

let riichi = [false,false,false];

/* ===== 山 ===== */
function createWall(){
    const tiles = [
        ..."123456789".split("").map(n=>"p"+n),
        ..."123456789".split("").map(n=>"s"+n),
        ..."1234567".split("").map(n=>"z"+n),
    ];
    let wall = [];
    tiles.forEach(t=>{
        for(let i=0;i<4;i++) wall.push(t);
    });
    return wall.sort(()=>Math.random()-0.5);
}

/* ===== 開始（ホストのみ） ===== */
function startGame(){
    game.wall = createWall();

    for(let i=0;i<3;i++){
        game.hands[i] = game.wall.splice(0,13);
    }

    startTurn(0);
}

/* ===== ターン（ホストのみ） ===== */
function startTurn(p){
    if(!isHost) return;

    game.turn = p;

    drawTile(p);

    if(p === 2){
        setTimeout(cpuMove,500);
    }else{
        sendState();
    }
}

/* ===== ツモ ===== */
function drawTile(p){
    if(game.wall.length === 0) return;

    game.hands[p].push(game.wall.pop());

    if(isWinning(game.hands[p])){
        show("ツモ！");
        endGame();
    }
}

/* ===== 捨て ===== */
function discard(p,i){
    const t = game.hands[p].splice(i,1)[0];
    game.river[p].push(t);

    // ロンチェック
    for(let k=0;k<3;k++){
        if(k !== p && isWinning([...game.hands[k], t])){
            show("ロン！");
            endGame();
        }
    }
}

/* ===== 次ターン ===== */
function nextTurn(){
    startTurn((game.turn + 1) % 3);
}

/* ===== CPU ===== */
function cpuMove(){
    if(!isHost) return;

    let hand = game.hands[2];
    let idx = Math.floor(Math.random() * hand.length);

    discard(2, idx);

    nextTurn();
    sendState();
}

/* ===== 終了 ===== */
function endGame(){
    game.turn = -1;
    sendState();
}

/* ===== クライアント→ホスト ===== */
function sendAction(action){

    if(isHost){
        handleAction(action);
        return;
    }

    if(!connected) return;

    conn.send({type:"action", data:action});
}

/* ===== ホスト処理 ===== */
function handleAction(action){

    if(action.type === "discard"){
        if(game.turn !== action.player) return;

        discard(action.player, action.index);

        nextTurn();
        sendState();
    }

    if(action.type === "riichi"){
        riichi[action.player] = true;
        show("リーチ！");
        sendState();
    }
}

/* ===== 状態送信 ===== */
function sendState(){
    if(conn){
        conn.send({type:"state", data:game});
    }
    draw();
}

/* ===== 描画 ===== */
function draw(){
    const h = document.getElementById("hand");
    h.innerHTML = "";

    const hand = game.hands[myIndex] || [];

    hand.forEach((t,i)=>{
        const d = document.createElement("div");
        d.className = "tile";
        d.textContent = t;

        d.onclick = ()=>{
            sendAction({
                type:"discard",
                player: myIndex,
                index: i
            });
        };

        h.appendChild(d);
    });

    document.getElementById("info").textContent =
        "自分:"+myIndex+" / ターン:"+game.turn + (game.turn===2?" CPU":"");
}

/* ===== リーチボタン（簡易） ===== */
document.body.addEventListener("keydown",(e)=>{
    if(e.key === "r"){
        sendAction({type:"riichi", player:myIndex});
    }
});

/* ===== 判定（簡易役なし和了形） ===== */
function isWinning(hand){
    hand = [...hand].sort();

    function f(h){
        if(h.length === 0) return true;

        if(h.filter(x=>x===h[0]).length >= 3){
            let nh = [...h];
            for(let i=0;i<3;i++) nh.splice(nh.indexOf(h[0]),1);
            if(f(nh)) return true;
        }

        let t = h[0];
        let s = t[0];
        let n = parseInt(t[1]);

        let need = [t, s+(n+1), s+(n+2)];

        if(h.includes(need[1]) && h.includes(need[2])){
            let nh = [...h];
            need.forEach(x=>nh.splice(nh.indexOf(x),1));
            if(f(nh)) return true;
        }

        return false;
    }

    for(let i=0;i<hand.length-1;i++){
        if(hand[i] === hand[i+1]){
            let rest = [...hand];
            rest.splice(i,2);
            if(f(rest)) return true;
        }
    }

    return false;
}

/* ===== 接続 ===== */
peer.on("open",id=>{
    const host = new URLSearchParams(location.search).get("id");

    if(host){
        conn = peer.connect(host);
        myIndex = 1;
        setup();
    }else{
        isHost = true;
        myIndex = 0;

        document.getElementById("info").textContent =
            "ホストURL:?id="+id;

        setTimeout(startGame,500);
    }
});

/* ===== クライアント接続 ===== */
peer.on("connection",c=>{
    conn = c;
    setup();
});

/* ===== 通信 ===== */
function setup(){

    conn.on("open",()=>{
        connected = true;
    });

    conn.on("data",msg=>{
        if(msg.type === "state"){
            game = msg.data;
            draw();
        }

        if(msg.type === "action"){
            handleAction(msg.data);
        }
    });
}

/* ===== 表示 ===== */
function show(text){
    const d = document.createElement("div");
    d.textContent = text;
    d.style.position = "absolute";
    d.style.top = "50%";
    d.style.left = "50%";
    d.style.transform = "translate(-50%,-50%)";
    d.style.fontSize = "50px";
    document.body.appendChild(d);

    setTimeout(()=>d.remove(),1000);
}
</script>

</body>
</html>
