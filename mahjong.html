<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サンマ（2人＋CPU）</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body {
    background:#2c3e50;
    color:white;
    text-align:center;
    font-family:sans-serif;
}
#hand {
    display:flex;
    justify-content:center;
    gap:6px;
    margin:20px;
}
.tile {
    width:40px;
    height:60px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:5px;
}
#info { margin:10px; }
</style>

</head>

<body>

<h1>サンマ（2人＋CPU）</h1>
<div id="info">接続中...</div>
<div id="share"></div>

<h3>自分の手牌</h3>
<div id="hand"></div>

<h3>捨て牌</h3>
<div id="river"></div>

<script>
const peer = new Peer();
let conn;
let isHost = false;
let myIndex = 0;

let game = {
    turn: 0,
    hands: [[],[],[]],
    river: [[],[],[]],
    wall: []
};

// ===== 牌生成 =====
function createWall(){
    const tiles = [
        ..."123456789".split("").map(n=>"p"+n),
        ..."123456789".split("").map(n=>"s"+n),
        ..."1234567".split("").map(n=>"z"+n),
    ];
    let wall=[];
    tiles.forEach(t=>{
        for(let i=0;i<4;i++) wall.push(t);
    });
    return wall.sort(()=>Math.random()-0.5);
}

// ===== 初期化 =====
function startGame(){
    game.wall = createWall();
    for(let i=0;i<3;i++){
        game.hands[i] = game.wall.splice(0,13);
    }
}

// ===== 描画 =====
function draw(){
    document.getElementById("info").textContent =
        "ターン: " + game.turn;

    const handEl = document.getElementById("hand");
    handEl.innerHTML="";
    game.hands[myIndex].forEach((t,i)=>{
        const d=document.createElement("div");
        d.className="tile";
        d.textContent=t;
        d.onclick=()=>playerDiscard(i);
        handEl.appendChild(d);
    });

    const riverEl = document.getElementById("river");
    riverEl.innerHTML="";
    game.river.forEach((r,i)=>{
        const line=document.createElement("div");
        line.textContent = i + ": " + r.join(",");
        riverEl.appendChild(line);
    });
}

// ===== ツモ =====
function drawTile(p){
    if(game.wall.length===0) return;
    game.hands[p].push(game.wall.pop());
}

// ===== 捨て =====
function discard(p,i){
    const t = game.hands[p].splice(i,1)[0];
    game.river[p].push(t);
}

// ===== ターン =====
function nextTurn(){
    game.turn = (game.turn+1)%3;

    if(isHost && game.turn===2){
        setTimeout(cpuMove,500);
    }
}

// ===== CPU =====
function cpuMove(){
    drawTile(2);

    let hand = game.hands[2];

    let index = hand.findIndex(t=>t.startsWith("z"));
    if(index===-1) index = Math.floor(Math.random()*hand.length);

    discard(2,index);
    nextTurn();
    send();
}

// ===== プレイヤー操作 =====
function playerDiscard(i){
    if(game.turn!==myIndex) return;

    drawTile(myIndex);
    discard(myIndex,i);

    nextTurn();
    send();
}

// ===== 通信 =====
function send(){
    if(conn) conn.send(game);
    draw();
}

// ===== 接続 =====
peer.on("open", id=>{
    const host = new URLSearchParams(location.search).get("id");

    if(host){
        conn = peer.connect(host);
        myIndex = 1;
        setup();
    }else{
        isHost = true;
        myIndex = 0;
        document.getElementById("share").innerHTML =
            "招待URL: "+location.href+"?id="+id;
    }
});

peer.on("connection", c=>{
    conn=c;
    setup();

    startGame();
    draw();
});

function setup(){
    conn.on("open", ()=>{
        document.getElementById("info").textContent="対戦開始";
    });

    conn.on("data", data=>{
        game = data;
        draw();
    });
}

// ===== 和了判定 =====
function isWinning(hand){
    hand = [...hand].sort();

    function canForm(h){
        if(h.length===0) return true;

        // 同じ牌3つ（刻子）
        if(h.filter(x=>x===h[0]).length>=3){
            let nh = [...h];
            for(let i=0;i<3;i++) nh.splice(nh.indexOf(h[0]),1);
            if(canForm(nh)) return true;
        }

        // 順子
        let t = h[0];
        let suit = t[0];
        let num = parseInt(t[1]);

        let needed = [t, suit+(num+1), suit+(num+2)];
        if(h.includes(needed[1]) && h.includes(needed[2])){
            let nh = [...h];
            needed.forEach(x=>nh.splice(nh.indexOf(x),1));
            if(canForm(nh)) return true;
        }

        return false;
    }

    // 雀頭探し
    for(let i=0;i<hand.length-1;i++){
        if(hand[i]===hand[i+1]){
            let rest = [...hand];
            rest.splice(i,2);
            if(canForm(rest)) return true;
        }
    }

    return false;
}

// ===== ロン判定 =====
function checkRon(player, tile){
    let testHand = [...game.hands[player], tile];
    return isWinning(testHand);
}

// ===== 捨て牌後にロンチェック =====
function discard(p,i){
    const t = game.hands[p].splice(i,1)[0];
    game.river[p].push(t);

    // 他プレイヤーがロンできるか
    for(let i=0;i<3;i++){
        if(i!==p){
            if(checkRon(i,t)){
                alert(i+" のロン！");
                location.reload();
                return;
            }
        }
    }
}

// ===== ツモ和了 =====
function drawTile(p){
    if(game.wall.length===0) return;

    const tile = game.wall.pop();
    game.hands[p].push(tile);

    if(isWinning(game.hands[p])){
        alert(p+" ツモ！");
        location.reload();
    }
}

// ===== CPUを少し強くする =====
function cpuMove(){
    drawTile(2);

    let hand = game.hands[2];

    // ロン狙い：揃いにくい牌を捨てる
    let counts = {};
    hand.forEach(t=>counts[t]=(counts[t]||0)+1);

    let index = hand.findIndex(t=>counts[t]===1);
    if(index===-1) index = Math.floor(Math.random()*hand.length);

    discard(2,index);
    nextTurn();
    send();
}

</script>

</body>
</html>
